# Weekly scheduled rightsizing analysis.
# The CronJob Pod runs the scheduler entrypoint directly (no HTTP API call).
#
# Flow: python -m app.scheduler.cluster_run
#   → schedule_cluster_rightsizing_run()
#   → namespace discovery / filter / batch → Celery workers → PostgreSQL
#
# Demo manifest — replace image, secrets, and env with your registry and config.

apiVersion: batch/v1
kind: CronJob
metadata:
  name: weekly-rightsizing
  namespace: rightsizing
  labels:
    app: right-sizing
    component: scheduled-analysis
spec:
  # Every Tuesday at 08:00 UTC
  schedule: "0 8 * * 2"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: right-sizing
            component: analysis-job
        spec:
          restartPolicy: OnFailure
          containers:
            - name: rightsizing-analysis
              # Set by CI/CD: right-sizing:<git-sha>
              image: right-sizing:REPLACE_ME
              imagePullPolicy: IfNotPresent
              command:
                - python
                - -m
                - app.scheduler.cluster_run
              env:
                - name: CLUSTER_NAME
                  value: "prod-us-east-1"
                - name: NAMESPACE_BLACKLIST
                  value: "kube-system"
                - name: BATCH_SIZE
                  value: "50"
                # Optional: comma-separated namespaces to include exclusively
                # - name: NAMESPACE_WHITELIST
                #   value: "payments,checkout,catalog"
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: rightsizing-secrets
                      key: database-url
                - name: REDIS_URL
                  valueFrom:
                    secretKeyRef:
                      name: rightsizing-secrets
                      key: redis-url
                - name: PROMETHEUS_URL
                  value: "http://prometheus.monitoring.svc:9090"
                - name: CLOUDABILITY_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: rightsizing-secrets
                      key: cloudability-api-key
              resources:
                requests:
                  cpu: "500m"
                  memory: "512Mi"
                limits:
                  cpu: "2"
                  memory: "2Gi"
