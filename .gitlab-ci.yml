# Rightsizing platform — GitLab CI/CD (demo)
#
# Two pipelines, separated by intent:
#
# 1) Application delivery (default — runs on push/MR)
#    test → build → smoke_test → deploy_dev → verify_dev_result
#    Validates code, builds the Docker image, smoke-tests the container,
#    and simulates deploy + verification to dev clusters (no real kubeconfig).
#
# 2) Optional manual CronJob trigger (not the production scheduler)
#    schedule_job → schedule_weekly_rightsizing (RUN_WEEKLY_RIGHTSIZER=true only)
#    Runs scripts/trigger_weekly_job.sh to create a one-off K8s Job from the CronJob.
#    Production weekly runs use deploy/k8s/cronjob.yaml:
#      python -m app.scheduler.cluster_run

stages:
  - test
  - build
  - smoke_test
  - deploy_dev
  - verify_dev_result
  - schedule_job

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  FLASK_ENV: testing
  SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
  IMAGE_NAME: "right-sizing"

cache:
  key: "${CI_COMMIT_REF_SLUG}-pip"
  paths:
    - .cache/pip

# =============================================================================
# test
# =============================================================================
pytest:
  stage: test
  image: python:3.9
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - pytest -v

# =============================================================================
# build
# =============================================================================
build-image:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker info
  script:
    - docker build -t "${IMAGE_NAME}:${CI_COMMIT_SHA}" .
    - docker image inspect "${IMAGE_NAME}:${CI_COMMIT_SHA}"

# =============================================================================
# smoke_test — validate container imports (no external DB required)
# =============================================================================
smoke-test-image:
  stage: smoke_test
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  needs:
    - build-image
  script:
    - docker run --rm "${IMAGE_NAME}:${CI_COMMIT_SHA}" python -c "import app; print('smoke test OK')"

# =============================================================================
# deploy_dev — demo deploy simulation (dev clusters only)
# =============================================================================
.cluster_script_base:
  image: alpine:3.19
  before_script:
    - apk add --no-cache bash
    - chmod +x scripts/*.sh
  needs:
    - build-image
    - smoke-test-image

deploy_dev_us_east_1:
  extends: .cluster_script_base
  stage: deploy_dev
  script:
    - ./scripts/deploy_to_cluster.sh dev-us-east-1 dev rightsizing dev-us-east-1 "${CI_COMMIT_SHA}"

deploy_dev_us_west_2:
  extends: .cluster_script_base
  stage: deploy_dev
  script:
    - ./scripts/deploy_to_cluster.sh dev-us-west-2 dev rightsizing dev-us-west-2 "${CI_COMMIT_SHA}"

# =============================================================================
# verify_dev_result — post-deploy checks (one job per dev cluster)
# =============================================================================
.verify_dev_base:
  image: alpine:3.19
  stage: verify_dev_result
  before_script:
    - apk add --no-cache bash
    - chmod +x scripts/*.sh

verify_dev_us_east_1:
  extends: .verify_dev_base
  needs:
    - job: deploy_dev_us_east_1
  script:
    - ./scripts/verify_cluster.sh dev-us-east-1 rightsizing dev-us-east-1

verify_dev_us_west_2:
  extends: .verify_dev_base
  needs:
    - job: deploy_dev_us_west_2
  script:
    - ./scripts/verify_cluster.sh dev-us-west-2 rightsizing dev-us-west-2

# =============================================================================
# schedule_job — optional manual CronJob trigger (not production runtime)
# =============================================================================
schedule_weekly_rightsizing:
  stage: schedule_job
  image: alpine:3.19
  before_script:
    - apk add --no-cache bash
    - chmod +x scripts/*.sh
  rules:
    - if: '$RUN_WEEKLY_RIGHTSIZER == "true"'
    - when: never
  script:
    - ./scripts/trigger_weekly_job.sh dev-us-east-1 rightsizing dev-us-east-1
    - ./scripts/trigger_weekly_job.sh dev-us-west-2 rightsizing dev-us-west-2
